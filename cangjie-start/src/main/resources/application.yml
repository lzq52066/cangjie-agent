server:
  port: 8080
  undertow:
    max-http-post-size: 2048MB
spring:
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: CangJieAgent
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  jackson:
    time-zone: GMT+8
  cache:
    type: caffeine
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  sql:
    init:
      mode: never

cangjie:
  observability:
    metrics:
      enabled: true
    llm-trace:
      # 是否对 prompt/response 内容脱敏（默认 false，全量明文存储）
      mask:
        enabled: false
      # 是否存储完整 prompt/response 内容（默认 true）
      store-content: true
      # 内容最大存储长度（字符，0 表示不限制），超长自动截断
      max-content-length: 20000

  rag:
    query-rewrite:
      enabled: false
      type: none
      llm:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
        model: gpt-4o-mini
        temperature: 0.3
        max-tokens: 200

  workflow:
    execution:
      retry:
        max-retries: 3
        delay-ms: 1000
        backoff-multiplier: 2.0

mybatis-plus:
  global-config:
    db-config:
      capital-mode: false
      table-format: "\"%s\""
      column-format: "\"%s\""
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml,mapper/*.xml
  type-aliases-package: cn.cangjiecloud.**.entity
  type-handlers-package: cn.cangjiecloud.common.mp.typehandler

# Sa-Token 配置
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:cangjie-cloud-secret-key-change-me-pls}
  token-name: token
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: random-32

system:
  default-username: admin
  default-password: ${SYSTEM_DEFAULT_PASSWORD:cangjiecloud@123456}
  default-phone: 18800000000
  default-email: admin@cangjiecloud.cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    cn.cangjiecloud: debug
    cn.cangjiecloud.observability.mapper.SystemMetricMapper: warn
    com.baomidou.mybatisplus: info
