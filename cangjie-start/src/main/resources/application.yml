server:
  port: 8080
  undertow:
    max-http-post-size: 2048MB
spring:
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: CangJieAgent
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  jackson:
    time-zone: GMT+8
  cache:
    type: caffeine
  flyway:
    # 数据库初始化已合并为单个脚本 db/migration/V1__init.sql，Flyway 按版本一次性执行
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  sql:
    init:
      mode: never

cangjie:
  security:
    # 模型 API Key 加密密钥（AES），生产环境务必通过环境变量修改
    model-key-secret: ${CANGJIE_MODEL_KEY_SECRET:cangjie-model-key-change-me-pls}
  auth:
    oidc:
      # 企业 OIDC 单点登录验签（默认关闭，仅应用 API Key 鉴权）。开启后企业用户浏览器直连可携带 IdP 签发的 JWT。
      enabled: false
      # 令牌签发方 iss（示例：https://idp.example.com）
      issuer:
      # JWKS 公钥地址（用于验签）
      jwks-uri:
      # 校验 aud（可选，留空跳过 aud 校验）
      audience:
      # 企业用户默认映射到的已发布应用 ID
      app-id:
  ratelimit:
    # 对话接口限流开关（按应用维度）
    enabled: true
    # 每秒允许请求数
    qps: 5
    # 突发容量
    burst: 10
  model:
    # 单次 LLM 请求超时（秒），同步/流式/嵌入调用均生效
    timeout-seconds: 120
    # 指定降级模型 ID（可选，为空时使用默认模型作为降级目标）
    fallback-model-id:
    breaker:
      # 模型熔断开关
      enabled: true
      # 连续失败多少次后熔断
      failure-threshold: 5
      # 熔断冷却时长（秒），冷却后半开探测
      cooldown-seconds: 30
  chat:
    # SSE 流式连接超时（秒）
    sse-timeout-seconds: 600
    history:
      # 历史消息 token 预算（超出从最旧消息截断，0 表示不限制）
      max-tokens: 6000
    session:
      # 会话滚动摘要开关
      summary-enabled: true
      # 每新增多少条消息触发一次摘要
      summary-every: 10
      # 摘要专用模型（可选，为空用应用绑定模型）
      summary-model-id:
  # Agent Harness 运行时（对话的唯一执行路径）全局默认参数；
  # 应用可在 application.config 的 harness 节点按项覆盖
  harness:
    # Function Calling 最大轮次
    max-rounds: 5
    # 单次 run 总超时（秒），超过后终止对话并返回超时提示
    timeout-seconds: 300
    # 单次工具调用兜底超时（秒）
    tool-timeout-seconds: 30
    # 工具输出回填模型的最大字符数
    max-tool-output-chars: 8000
    # 是否启用人工审批拦截（高危工具执行前挂起 run，等待审批接口恢复）
    approval-enabled: false
    # 审批单默认有效期（秒）
    approval-timeout-seconds: 1800
    # 超时审批单的默认决策留痕（reject/approve），仅写入审批单备注，不会替用户放行工具
    approval-timeout-default-decision: reject
    # 审批过期扫描任务开关：逾期 pending 单置 expired，挂起的 run 置 failed
    approval-expiry-scan-enabled: true
    # 审批过期扫描间隔（毫秒）
    approval-expiry-scan-interval-ms: 60000
    # 是否向前端推送 tool_start / tool_finish 事件（OpenAI 兼容客户端不应收到非标准帧，保持关闭）
    sse-tool-events: false
    context:
      # 上下文预算裁剪开关（默认关闭，关闭时不裁剪上下文）
      budget-enabled: false
      # 上下文 token 预算（budget-enabled=true 时生效，0 表示不限制）
      budget-tokens: 0
  memory:
    inject:
      # 记忆注入最大条数（按强度评分取 TopN）
      max-count: 20
      # 记忆注入最大字符数
      max-chars: 2000
    decay:
      # 记忆遗忘任务开关
      enabled: true
      # 执行周期（默认每日 03:00）
      cron: "0 0 3 * * ?"
      # 评分低于该阈值的记忆自动停用
      threshold: 0.25
      # 时近衰减半衰期（天）
      half-life-days: 30
      # 单用户单应用激活记忆容量上限（0 表示不限制）
      capacity-per-user: 100
    # 语义去重/合并（依赖 embedding 向量能力，未配置 embedding 时自动降级为精确去重）
    dedup:
      # 向量近邻候选条数
      candidate-limit: 5
      # 相似度 ≥ 该值视为同一条记忆：只增加置信度，不新增（0~1）
      duplicate-threshold: 0.92
      # 相似度落在 [merge-threshold, duplicate-threshold) 时，自动提取链路调 LLM 判断是否合并
      merge-threshold: 0.82
      # 重复/合并确认时置信度的强化步长（累加封顶 1.0）
      reinforce-step: 0.1
  openapi:
    # 对外接口路径前缀
    prefix: /api/open
    # 是否允许网页匿名聊天（免 API Key，仅凭 appId 接入）。本地部署默认开启；
    # 若需要更严格的安全控制，可关闭后仅允许开发者带 API Key 调用。
    web-anonymous: true
  templates:
    # 启动时自动导入官方内置模板（classpath:official-templates/*.json，按 templateKey 幂等）
    import-builtin: true
  observability:
    metrics:
      enabled: true
    trace:
      # span 保留天数，<=0 表示不清理。**默认关**：这是一条物理 DELETE，老库升级后第一次调度
      # 就会把保留期之前的历史链路全删掉，而升级的人不会预期「装新版本 = 删历史」。
      # 载荷三列确实只能靠物理删除回收空间，确认历史可弃后再显式设成 30 之类
      retention-days: 0
      # span 写入缓冲容量：满了丢新来的并计数（独立线程池，不与业务线程池共抢）
      write-queue-capacity: 2000
    # 检索载荷开关：是否把用户 query 与知识库正文写进 span 载荷。
    # 默认跟着模型载荷的 store-content 走 —— 同一套链路里不能留一条绕过闸门的写入路径
    trace-payload:
      enabled: ${cangjie.observability.llm-trace.store-content:true}
    # span 外导（OTLP/HTTP）：把链路推给已有的观测体系，默认整个出口不装配
    exporter:
      otlp:
        enabled: false
        # Collector / Jaeger / Tempo 的 OTLP HTTP 地址，只给主机端口也会自动补 /v1/traces
        endpoint: ${OTLP_ENDPOINT:}
        # 附加请求头，形如 authorization=Bearer xxx,x-tenant=acme
        headers: ${OTLP_HEADERS:}
        timeout-ms: 3000
        # 是否把 query 与知识库正文一起外发。默认关：开了就等于把内容送出内网，
        # 这个决定必须由部署方显式做出，不能跟着「开启链路导出」顺手带上
        include-payload: false
        # 出口只入队、后台批量发送：对端抖动绝不回压到对话主链路
        queue-capacity: 5000
        batch-size: 200
        flush-interval-ms: 5000
    llm-trace:
      # 是否对 prompt/response 内容脱敏（默认 false，全量明文存储）
      mask:
        enabled: false
      # 是否存储完整 prompt/response 内容（默认 true）
      store-content: true
      # 内容最大存储长度（字符，0 表示不限制），超长自动截断
      max-content-length: 20000
      # 成功调用的采样率（0~1）：失败永远留档，采样只削成功的那部分。
      # 0 不等于全丢，而是「只留失败」；高流量应用降到 0.1 就能把表写速降一个量级。
      # 采样按 traceId 决定（同一条链路要么整条留、要么整条丢），不逐调用掷随机数，
      # 否则链路视图会拼出残缺链路。注意被点踩的调用无法强制留档（点踩发生在写库之后），
      # 所以坏 case 回流取的是会话消息侧，不依赖这里的采样结果
      sample-rate: 1.0
      # 异步批量落库：实体仍在请求线程组装（traceId/userId 靠 ThreadLocal），只把写库推到后台
      async:
        enabled: true
        # 缓冲容量：满了就丢弃新来的并计数，绝不拖住对话线程
        queue-capacity: 2000
        # 单批行数与定时冲刷间隔
        batch-size: 200
        flush-interval-ms: 2000
      # 保留天数，<=0 表示不清理。**默认关**（同 trace.retention-days：物理删除不可逆，
      # 不该由升级动作顺带触发）；打开后与 agent_run 对齐，避免「有链路无正文」
      retention-days: 0
      # 正文关键词检索的 trgm 索引：启动完成后在后台线程 CONCURRENTLY 建（不在 Flyway 事务里，
      # 那会锁写）。关掉只是让 promptKeyword / responseKeyword 回到顺序扫描，不影响功能
      ensure-trgm-index: true

  eval:
    regress:
      # 回归门禁阈值：与上一次运行对比时，任一指标均值跌幅超过这个绝对值（0.05 即 5 个百分点）就告警。
      # 只写日志与对比结果、不把 run 标成失败：要拦的是「这次改动要不要上」，不是这行读数本身。配 0 即关闭。
      threshold: 0.05
    online:
      # 定时抽样打分（默认关）：开着它就等于默认同意持续花判定 token，必须由部署方显式打开
      enabled: false
      # 每轮最多评多少条（单轮硬上限 200）：在线评测每条样本要跑 2~4 次判定调用
      limit: 20
      # 每天凌晨 3:30 跑一轮
      cron: "0 30 3 * * ?"

  rag:
    # 对话主链路默认检索条数（应用侧显式配置时以应用配置为准）
    top-k: 5
    query-rewrite:
      enabled: false
      type: none
      llm:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
        model: gpt-4o-mini
        temperature: 0.3
        max-tokens: 200

  retrieval:
    # 融合方式：rrf（默认，只取名次，跨批次稳定）/ weighted（加权分数，依赖各通道分数尺度）
    fusion: rrf
    # RRF 平滑常数 k（业界惯例 60）
    rrf-k: 60
    # weighted 融合下的通道权重（fusion=weighted 时生效）
    vector-weight: 0.7
    fulltext-weight: 0.3
    # 融合前每个通道多取的候选倍数
    candidate-multiplier: 3
    rerank:
      enabled: false
      # none / bge / cohere
      type: none

  workflow:
    execution:
      retry:
        max-retries: 3
        delay-ms: 1000
        backoff-multiplier: 2.0

mybatis-plus:
  global-config:
    db-config:
      capital-mode: false
      table-format: "\"%s\""
      column-format: "\"%s\""
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/*.xml
  type-aliases-package: cn.cangjiecloud.**.entity
  type-handlers-package: cn.cangjiecloud.common.mp.typehandler

# Sa-Token 配置
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:cangjie-cloud-secret-key-change-me-pls}
  token-name: token
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: random-32

system:
  default-username: admin
  # 内置管理员初始密码：首次登录后会被强制修改，部署时也可通过 SYSTEM_DEFAULT_PASSWORD 覆盖
  default-password: ${SYSTEM_DEFAULT_PASSWORD:admin123}
  default-phone: 18800000000
  default-email: admin@cangjiecloud.cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    cn.cangjiecloud: debug
    cn.cangjiecloud.observability.mapper.SystemMetricMapper: warn
    com.baomidou.mybatisplus: info

# 可观测性：暴露健康检查与内置指标端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name:CangJieAgent}
