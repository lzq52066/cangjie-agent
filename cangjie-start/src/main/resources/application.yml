server:
  port: 8080
  undertow:
    max-http-post-size: 2048MB
spring:
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: CangJieAgent
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  jackson:
    time-zone: GMT+8
  cache:
    type: caffeine
  flyway:
    # 数据库初始化已合并为单个脚本 db/migration/V1__init.sql，Flyway 按版本一次性执行
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  sql:
    init:
      mode: never

cangjie:
  security:
    # 模型 API Key 加密密钥（AES），生产环境务必通过环境变量修改
    model-key-secret: ${CANGJIE_MODEL_KEY_SECRET:cangjie-model-key-change-me-pls}
  auth:
    oidc:
      # 企业 OIDC 单点登录验签（默认关闭，仅应用 API Key 鉴权）。开启后企业用户浏览器直连可携带 IdP 签发的 JWT。
      enabled: false
      # 令牌签发方 iss（示例：https://idp.example.com）
      issuer:
      # JWKS 公钥地址（用于验签）
      jwks-uri:
      # 校验 aud（可选，留空跳过 aud 校验）
      audience:
      # 企业用户默认映射到的已发布应用 ID
      app-id:
  ratelimit:
    # 对话接口限流开关（按应用维度）
    enabled: true
    # 每秒允许请求数
    qps: 5
    # 突发容量
    burst: 10
  model:
    # 单次 LLM 请求超时（秒），同步/流式/嵌入调用均生效
    timeout-seconds: 120
    # 指定降级模型 ID（可选，为空时使用默认模型作为降级目标）
    fallback-model-id:
    breaker:
      # 模型熔断开关
      enabled: true
      # 连续失败多少次后熔断
      failure-threshold: 5
      # 熔断冷却时长（秒），冷却后半开探测
      cooldown-seconds: 30
  chat:
    # SSE 流式连接超时（秒）
    sse-timeout-seconds: 600
    agent:
      # Function Calling 最大轮次
      max-rounds: 5
      # Agent 循环总超时（秒），超过后终止对话并返回超时提示
      timeout-seconds: 300
    history:
      # 历史消息 token 预算（超出从最旧消息截断，0 表示不限制）
      max-tokens: 6000
    session:
      # 会话滚动摘要开关
      summary-enabled: true
      # 每新增多少条消息触发一次摘要
      summary-every: 10
      # 摘要专用模型（可选，为空用应用绑定模型）
      summary-model-id:
  memory:
    inject:
      # 记忆注入最大条数（按强度评分取 TopN）
      max-count: 20
      # 记忆注入最大字符数
      max-chars: 2000
    decay:
      # 记忆遗忘任务开关
      enabled: true
      # 执行周期（默认每日 03:00）
      cron: "0 0 3 * * ?"
      # 评分低于该阈值的记忆自动停用
      threshold: 0.25
      # 时近衰减半衰期（天）
      half-life-days: 30
      # 单用户单应用激活记忆容量上限（0 表示不限制）
      capacity-per-user: 100
  openapi:
    # 对外接口路径前缀
    prefix: /api/open
    # 是否允许网页匿名聊天（免 API Key，仅凭 appId 接入）。本地部署默认开启；
    # 若需要更严格的安全控制，可关闭后仅允许开发者带 API Key 调用。
    web-anonymous: true
  templates:
    # 启动时自动导入官方内置模板（classpath:official-templates/*.json，按 templateKey 幂等）
    import-builtin: true
  observability:
    metrics:
      enabled: true
    llm-trace:
      # 是否对 prompt/response 内容脱敏（默认 false，全量明文存储）
      mask:
        enabled: false
      # 是否存储完整 prompt/response 内容（默认 true）
      store-content: true
      # 内容最大存储长度（字符，0 表示不限制），超长自动截断
      max-content-length: 20000

  rag:
    query-rewrite:
      enabled: false
      type: none
      llm:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
        model: gpt-4o-mini
        temperature: 0.3
        max-tokens: 200

  workflow:
    execution:
      retry:
        max-retries: 3
        delay-ms: 1000
        backoff-multiplier: 2.0

mybatis-plus:
  global-config:
    db-config:
      capital-mode: false
      table-format: "\"%s\""
      column-format: "\"%s\""
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/*.xml
  type-aliases-package: cn.cangjiecloud.**.entity
  type-handlers-package: cn.cangjiecloud.common.mp.typehandler

# Sa-Token 配置
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:cangjie-cloud-secret-key-change-me-pls}
  token-name: token
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: random-32

system:
  default-username: admin
  default-password: ${SYSTEM_DEFAULT_PASSWORD:cangjiecloud@123456}
  default-phone: 18800000000
  default-email: admin@cangjiecloud.cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    cn.cangjiecloud: debug
    cn.cangjiecloud.observability.mapper.SystemMetricMapper: warn
    com.baomidou.mybatisplus: info

# 可观测性：暴露健康检查与 Prometheus 指标端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name:CangJieAgent}
