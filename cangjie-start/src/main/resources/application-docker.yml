spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cangjie_agent}
    username: ${DB_USERNAME:cangjie}
    password: ${DB_PASSWORD:cangjie_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_secret}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  flyway:
    # 数据库初始化已合并为单个脚本 db/migration/V1__init.sql
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    cn.cangjiecloud: info
  file:
    path: /app/logs