# CangJie Agent 一键全栈部署
# 包含：PostgreSQL(pgvector+pgroonga) / Redis / MinIO / 后端 / 前端Nginx
# 用法：
#   cp .env.example .env  并按需修改（尤其是 MINIO_PUBLIC_ENDPOINT / 各类密钥）
#   docker compose up -d --build
# 访问：http://<服务器IP>/admin/   默认账号 admin（密码见 SYSTEM_DEFAULT_PASSWORD）
name: cangjie

services:
  # ==================== PostgreSQL 16 + pgvector + pgroonga ====================
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: cangjie-postgres:16
    container_name: cangjie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cangjie_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cangjie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cangjie_secret}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cangjie-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cangjie} -d ${POSTGRES_DB:-cangjie_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 生产环境建议不对外暴露数据库端口，仅集群内访问；需要本地调试时再放开
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # ==================== Redis 7 ====================
  redis:
    image: redis:7-alpine
    container_name: cangjie-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cangjie-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ==================== MinIO 对象存储 ====================
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: cangjie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - cangjie-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 9000 S3 API（浏览器预签名下载需可从宿主机访问）/ 9001 管理控制台
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # 初始化 MinIO 存储桶（幂等，退出即可，后端启动前确保桶已存在）
  createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: cangjie-createbucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-cangjie-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      echo 'bucket ready';
      "
    networks:
      - cangjie-net

  # ==================== 后端 Spring Boot ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cangjie-agent:latest
    container_name: cangjie-agent
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      # 数据库
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cangjie_agent}
      DB_USERNAME: ${POSTGRES_USER:-cangjie}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cangjie_secret}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      # MinIO / OSS
      OSS_TYPE: minio
      OSS_MINIO_ENDPOINT: http://minio:9000
      # 浏览器访问 MinIO 预签名 URL 的对外地址，部署到服务器必须改成 http://<服务器IP或域名>:9000
      OSS_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      OSS_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      OSS_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      OSS_MINIO_BUCKET: ${MINIO_BUCKET:-cangjie-files}
      # Embedding（知识库向量化，需外部 OpenAI 兼容服务；表结构固定 1024 维）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # 安全相关（生产必改）
      CANGJIE_MODEL_KEY_SECRET: ${CANGJIE_MODEL_KEY_SECRET:-change-me-model-key-secret-32chars}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-change-me-to-a-random-64-chars-string}
      SYSTEM_DEFAULT_PASSWORD: ${SYSTEM_DEFAULT_PASSWORD:-cangjiecloud@123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    volumes:
      - backend-logs:/app/logs
    networks:
      - cangjie-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    # 默认不对外暴露，统一经前端 Nginx 反代；需要直连调试时可放开
    expose:
      - "8080"

  # ==================== 前端（Admin + Chat）Nginx ====================
  frontend:
    build:
      context: ./cangjie-agent-ui
      dockerfile: Dockerfile
    image: cangjie-agent-ui:latest
    container_name: cangjie-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - cangjie-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-logs:

networks:
  cangjie-net:
    driver: bridge
