# ============================================================
# Redis 配置（容器内运行，redis:7-alpine）
#
# 直接修改本文件，然后在 deploy/ 目录执行 ./04-start.sh（或 docker compose up -d redis）
# 即可生效；数据持久化在宿主机 ./data/redis（AOF 多文件模式）。
#
# 密码不写在这里：requirepass 由 docker-compose.yml 在启动命令行注入
# （值来自 .env 的 REDIS_PASSWORD），命令行参数优先级高于本文件。
# ============================================================

# ---------- 网络 ----------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 常规 ----------
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# ---------- 内存与淘汰策略 ----------
# 生产建议取消注释并按服务器内存设置上限；留空则可用全部容器内存。
# maxmemory 1gb
# maxmemory-policy allkeys-lru

# ---------- 快照（RDB） ----------
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------- AOF 持久化 ----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ---------- 慢查询 ----------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------- 客户端缓冲（SSE/长连接较多时可调大） ----------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
