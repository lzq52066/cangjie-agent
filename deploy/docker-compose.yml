# ============================================================
# CangJie Agent 制品部署编排（服务器上不编译，直接运行 jar + dist）
# 各服务自包含，构建上下文即各自目录：
#   ./backend/artifacts/cangjie-start.jar  后端制品（由 pack.ps1 / pack.sh 从 target 拷贝）
#   ./frontend/dist/             前端制品（admin + chat）
#   ./postgres、./backend、./frontend  运行时镜像/配置定义
#     ./backend/artifacts        后端 jar（挂载生效，原子替换后 restart backend 即可，无需重建镜像）
#     ./backend/config           外部化配置目录（放 application-docker.yml，restart backend 生效）
#     ./redis/redis.conf          Redis 配置（修改后 ./04-start.sh 生效，密码不写在此文件）
#     ./backend/logback-spring.xml 后端日志配置（SQL 并入 info.log，restart backend 生效）
#     ./frontend/dist             前端页面（挂载生效，覆盖新文件后 reload nginx 即可，无需重建镜像）
#     ./frontend/certs            HTTPS 证书（server.crt + server.key，放好后 restart frontend 生效）
#   ./data/                      持久化数据（数据库/缓存/对象存储/日志），直接躺在宿主机上
#
# 端口策略：对外只暴露前端 Nginx 的 80 / 443 端口（由 WEB_PORT / WEB_SSL_PORT 控制）。
#   443 仅在 ./frontend/certs/ 放好 server.crt + server.key 后才监听，此时 80 的请求 301 跳到 443；
#   未放证书时只有 80 提供 HTTP 服务。
#   PostgreSQL（宿主机 15432）/ Redis（宿主机 16379）供本地调试直连，公网暴露时
#   必须在云安全组限制来源 IP；MinIO 不发布到宿主机，三者容器间均走 cangjie-net 内网；
#   MinIO 文件（预签名 URL）走 Nginx 的 /<桶名>/，控制台走 /minio-console/。
# 用法：见 README.md / 直接执行 ./deploy-all.sh
# ============================================================
name: cangjie

services:
  # ---------- PostgreSQL 16 + pgvector + pgroonga ----------
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: cangjie-postgres:16
    container_name: cangjie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cangjie_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cangjie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cangjie123}
      TZ: Asia/Shanghai
    volumes:
      # 数据直接落在宿主机 ./data/postgres，便于备份与迁移
      # :z 用于 SELinux 开启的系统（CentOS/RedHat 默认开启），非 SELinux 环境会被忽略
      - ./data/postgres:/var/lib/postgresql/data:z
    networks: [cangjie-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cangjie} -d ${POSTGRES_DB:-cangjie_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 宿主机 15432 -> 容器 5432，供本地 GUI 直连（公网暴露，务必在云安全组限制来源 IP）
    ports:
      - "15432:5432"

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: cangjie-redis
    restart: unless-stopped
    # 以挂载的 redis/redis.conf 启动；密码由 .env 的 REDIS_PASSWORD 在命令行注入
    # （命令行参数优先级高于配置文件，避免把密码写进 redis.conf）
    command:
      - redis-server
      - /etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-cangjie123}
    volumes:
      - ./data/redis:/data:z
      # 配置文件只读挂载，改完执行 ./04-start.sh 即可生效
      - ./redis/redis.conf:/etc/redis/redis.conf:ro,z
    networks: [cangjie-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cangjie123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    # 宿主机 16379 -> 容器 6379，供本地调试直连（公网暴露，务必在云安全组限制来源 IP）
    ports:
      - "16379:6379"

  # ---------- MinIO 对象存储 ----------
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: cangjie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cangjie}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cangjie123}
      # 控制台走 Nginx 的 /minio-console/ 子路径（唯一对外入口是 80 端口）
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_PUBLIC_URL:-http://localhost/minio-console}
      MINIO_BROWSER_REDIRECT_URL_DYNAMIC: "on"
    volumes:
      # 对象存储文件直接落在宿主机 ./data/minio
      - ./data/minio:/data:z
    networks: [cangjie-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # MinIO 的 9000/9001 均不发布到宿主机，仅通过前端 Nginx 反代对外提供服务

  # ---------- MinIO 建桶（一次性，退出即完成） ----------
  createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: cangjie-createbucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cangjie}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cangjie123}
      MINIO_BUCKET: ${MINIO_BUCKET:-cangjie-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      echo 'bucket ready';
      "
    networks: [cangjie-net]

  # ---------- 后端（运行已编译 jar） ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cangjie-backend:latest
    container_name: cangjie-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cangjie_agent}
      DB_USERNAME: ${POSTGRES_USER:-cangjie}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cangjie123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-cangjie123}
      OSS_TYPE: minio
      OSS_MINIO_ENDPOINT: http://minio:9000
      OSS_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost}
      OSS_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cangjie}
      OSS_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cangjie123}
      OSS_MINIO_BUCKET: ${MINIO_BUCKET:-cangjie-files}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # 是否在嵌入请求中传 dimensions 参数：bge-m3 等固定维度模型不支持该参数，需设为 false
      EMBEDDING_DIMENSION_ENABLED: ${EMBEDDING_DIMENSION_ENABLED:-false}
      CANGJIE_MODEL_KEY_SECRET: ${CANGJIE_MODEL_KEY_SECRET:-change-me-model-key-secret-32chars}
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-change-me-to-a-random-64-chars-string}
      # 外部 logback 配置：开启 MyBatis SQL 日志并写入 /app/logs/sql.log（见 backend/logback-spring.xml）
      LOGGING_CONFIG: file:/app/logback-spring.xml
      # 外部化配置目录：backend/config/ 下的 application-docker.yml 按 key 覆盖 jar 内默认值
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      SYSTEM_DEFAULT_USERNAME: ${SYSTEM_DEFAULT_USERNAME:-admin}
      # 管理员初始密码：首次登录后会被强制修改
      SYSTEM_DEFAULT_PASSWORD: ${SYSTEM_DEFAULT_PASSWORD:-cangjie123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    volumes:
      # 后端日志直接落在宿主机 ./data/logs（error.log / info.log / sql.log）
      - ./data/logs:/app/logs:z
      # 后端 jar 直接挂载宿主机 ./backend/artifacts（镜像内不含 jar）
      # 更新制品：先传成 *.new，再 mv -f 原子替换，最后 docker compose restart backend
      - ./backend/artifacts:/app/artifacts:ro,z
      # 运行时日志配置（只读），改完 docker compose restart backend 即生效，无需重打 jar
      - ./backend/logback-spring.xml:/app/logback-spring.xml:ro,z
      # 外部化配置（只读）：放 application-docker.yml 覆盖 jar 内默认配置，restart backend 生效
      - ./backend/config:/app/config:ro,z
    networks: [cangjie-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    expose:
      - "8080"

  # ---------- 前端 Nginx（托管 dist + 反代后端） ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cangjie-nginx:latest
    container_name: cangjie-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 注入 Nginx 模板：S3 预签名 URL 反代到 /<桶名>/，桶名与 .env 保持一致
      MINIO_BUCKET: ${MINIO_BUCKET:-cangjie-files}
    volumes:
      # 前端页面直接挂载宿主机 ./frontend/dist（镜像内不再作为唯一来源）
      # 更新制品后只需：docker compose exec frontend nginx -s reload
      - ./frontend/dist:/usr/share/nginx/html:ro,z
      # HTTPS 证书目录（可选）：放入 server.crt + server.key 后 restart frontend 即启用 HTTPS
      - ./frontend/certs:/etc/nginx/certs:ro,z
    ports:
      - "${WEB_PORT:-80}:80"
      # HTTPS 端口（可选）：未放置证书时容器内无 443 监听，该端口连接被拒绝
      - "${WEB_SSL_PORT:-443}:443"
    networks: [cangjie-net]

networks:
  cangjie-net:
    driver: bridge
